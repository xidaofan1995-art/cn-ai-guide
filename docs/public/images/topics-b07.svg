<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-label="数据敏感度、硬件预算与最小离线验证"><rect width="640" height="530" rx="18" fill="#fbfaf6"/><g font-family="Noto Sans SC, Microsoft YaHei, sans-serif"><text x="24" y="32" font-size="23" font-weight="bold" fill="#294a36">B07 · 数据敏感度、硬件预算与最小离线验证</text><text x="24" y="56" font-size="15" fill="#69776d">建议框架 · 非实测 · 2026-11-27</text><rect x="24" y="74" width="592" height="80" rx="12" fill="#edf5ef" stroke="#b9cdbd"/><text x="48" y="105" font-size="24" font-weight="bold" fill="#294a36">数据可否外发？</text><text x="48" y="132" font-size="18" fill="#4a5a50">禁止 → 获准本地环境；允许 → 比较方案</text><path d="M320 154 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#708c75" stroke-width="2"/><rect x="24" y="180" width="592" height="80" rx="12" fill="#fff6e5" stroke="#d3b17b"/><text x="48" y="211" font-size="24" font-weight="bold" fill="#294a36">任务与硬件是否匹配？</text><text x="48" y="238" font-size="18" fill="#4a5a50">短文本起步，检查内存、速度和准确率</text><path d="M320 260 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#708c75" stroke-width="2"/><rect x="24" y="286" width="592" height="80" rx="12" fill="#edf5ef" stroke="#b9cdbd"/><text x="48" y="317" font-size="24" font-weight="bold" fill="#294a36">选择运行入口</text><text x="48" y="344" font-size="18" fill="#4a5a50">图形界面：LM Studio；脚本/API：Ollama</text><path d="M320 366 v22 m-7 -7 7 7 7 -7" fill="none" stroke="#708c75" stroke-width="2"/><rect x="24" y="392" width="592" height="80" rx="12" fill="#edf5ef" stroke="#b9cdbd"/><text x="48" y="423" font-size="24" font-weight="bold" fill="#294a36">验证后再扩大投入</text><text x="48" y="450" font-size="18" fill="#4a5a50">先断网复测、核对任务结果，再考虑采购</text></g></svg>